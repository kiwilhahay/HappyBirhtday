<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nadin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* =========================
           HALAMAN 1
        ========================= */

        .halaman1 {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ffb6d9, #ffd6e8);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .kotak {
            background: rgba(255, 255, 255, 0.35);
            padding: 45px 70px;
            border-radius: 30px;
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(150, 50, 100, 0.2);
            z-index: 10;
        }

        .kotak h1 {
    color: #d63384;
    font-size: 42px;
    margin-bottom: 25px;
    animation: denyut 1.3s infinite;
}

        .kotak p {
            color: #a52a65;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .tombol {
            border: none;
            background: #ff4f9a;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 15px 45px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(200, 30, 100, 0.3);
            transition: 0.3s;
        }

        .tombol:hover {
            background: #e83e8c;
            transform: scale(1.08);
        }

        /* =========================
           BUNGA
        ========================= */

        .bunga {
            position: absolute;
            font-size: 45px;
            animation: melayang 4s ease-in-out infinite;
            user-select: none;
        }

        .bunga1 { top: 5%; left: 5%; }
        .bunga2 { top: 15%; left: 25%; animation-delay: 1s; }
        .bunga3 { top: 8%; right: 8%; animation-delay: 2s; }
        .bunga4 { top: 35%; left: 8%; animation-delay: 1.5s; }
        .bunga5 { top: 45%; right: 7%; animation-delay: 2.5s; }
        .bunga6 { bottom: 10%; left: 8%; animation-delay: 1s; }
        .bunga7 { bottom: 5%; right: 10%; animation-delay: 2s; }
        .bunga8 { bottom: 20%; left: 30%; animation-delay: 3s; }
        .bunga9 { top: 25%; right: 28%; animation-delay: 1.5s; }
        .bunga10 { bottom: 30%; right: 30%; animation-delay: 2.5s; }
        .bunga11 { top: 55%; left: 20%; animation-delay: 1s; }
        .bunga12 { bottom: 8%; left: 50%; animation-delay: 2s; }

        @keyframes melayang {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(10deg);
            }
        }


        /* =========================
           HALAMAN 2
        ========================= */

        .halaman2 {
            display: none;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ff9dcc, #ffd1e5);
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .ucapan {
            text-align: center;
            z-index: 10;
        }

        .ucapan h1 {
            color: #d81b73;
            font-size: 65px;
            font-weight: bold;
            text-shadow: 3px 3px 8px rgba(150, 0, 70, 0.2);

            /* Efek berdenyut */
            animation: denyut 1.3s infinite;
        }

        .ucapan p {
            margin-top: 20px;
            color: #a51c5b;
            font-size: 24px;
        }

        @keyframes denyut {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Bunga halaman 2 */

        .bunga2page {
            position: absolute;
            font-size: 50px;
            animation: melayang2 5s ease-in-out infinite;
        }

        .b1 { top: 5%; left: 5%; }
        .b2 { top: 12%; right: 10%; animation-delay: 1s; }
        .b3 { bottom: 10%; left: 7%; animation-delay: 2s; }
        .b4 { bottom: 5%; right: 8%; animation-delay: 3s; }
        .b5 { top: 40%; left: 8%; animation-delay: 1.5s; }
        .b6 { top: 45%; right: 8%; animation-delay: 2.5s; }
        .b7 { bottom: 25%; left: 25%; animation-delay: 1s; }
        .b8 { top: 20%; right: 30%; animation-delay: 2s; }
        .b9 { bottom: 20%; right: 28%; animation-delay: 3s; }
        .b10 { top: 10%; left: 40%; animation-delay: 2s; }

        @keyframes melayang2 {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        /* Responsif HP */

        @media (max-width: 600px) {
            .kotak {
                padding: 35px 25px;
                margin: 20px;
            }

            .kotak h1 {
                font-size: 30px;
            }

            .ucapan h1 {
                font-size: 38px;
            }

            .ucapan p {
                font-size: 18px;
            }

            .bunga,
            .bunga2page {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HALAMAN PERTAMA
    ========================== -->

    <div class="halaman1" id="halaman1">

        <!-- Bunga -->
        <div class="bunga bunga1">🌸</div>
        <div class="bunga bunga2">🌷</div>
        <div class="bunga bunga3">🌸</div>
        <div class="bunga bunga4">🌼</div>
        <div class="bunga bunga5">🌸</div>
        <div class="bunga bunga6">🌷</div>
        <div class="bunga bunga7">🌼</div>
        <div class="bunga bunga8">🌸</div>
        <div class="bunga bunga9">🌷</div>
        <div class="bunga bunga10">🌸</div>
        <div class="bunga bunga11">🌼</div>
        <div class="bunga bunga12">🌸</div>

        <div class="kotak">
            <button class="tombol" onclick="bukaUcapan()">
                💗 SENTIL 💗
            </button>
        </div>

    </div>


    <!-- =========================
         HALAMAN KEDUA
    ========================== -->

    <div class="halaman2" id="halaman2">

        <!-- Bunga -->
        <div class="bunga2page b1">🌸</div>
        <div class="bunga2page b2">🌷</div>
        <div class="bunga2page b3">🌼</div>
        <div class="bunga2page b4">🌸</div>
        <div class="bunga2page b5">🌷</div>
        <div class="bunga2page b6">🌸</div>
        <div class="bunga2page b7">🌼</div>
        <div class="bunga2page b8">🌸</div>
        <div class="bunga2page b9">🌷</div>
        <div class="bunga2page b10">🌸</div>

        <div class="ucapan">
            <h1>Happy Birthday<br>
            Nadinn</h1>
        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        function bukaUcapan() {

            // Sembunyikan halaman pertama
            document.getElementById("halaman1").style.display = "none";

            // Tampilkan halaman kedua
            document.getElementById("halaman2").style.display = "flex";

        }

    </script>

</body>
</html>
